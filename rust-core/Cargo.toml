[package]
name = "proxy_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native networking, routing, and tun2socks core for Kestrel Android proxy client"

[lib]
name = "proxy_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
socket2 = { version = "0.5", features = ["all"] }
ipnet = "2"
base64 = "0.22"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
