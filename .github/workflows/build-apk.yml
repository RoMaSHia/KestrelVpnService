name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            build-tools;34.0.0
            ndk;27.2.12479018

      - name: Expose ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust crates and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify native libraries in APKs
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libproxy_core.so
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep libproxy_core.so

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
