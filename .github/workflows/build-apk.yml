name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms, build-tools & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust crates and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache fallback CI signing keystore for in-place updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kestrel-ci-fallback-keystore-v1

      - name: Decode optional release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Package and verify APKs
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Kestrel-universal.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kestrel-debug.apk
          "${SDK_ROOT}/build-tools/35.0.0/apksigner" verify dist/Kestrel-universal.apk
          unzip -l dist/Kestrel-universal.apk | grep libproxy_core.so
          unzip -l dist/Kestrel-debug.apk | grep libproxy_core.so

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Kestrel-universal.apk
            dist/Kestrel-debug.apk
