name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platforms, build-tools & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ] || [ ! -w "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools/latest" /tmp/cmdline-tools
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
            rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust crates and build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust-core

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Cache fallback CI signing keystore for in-place updates
        uses: actions/cache@v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: kestrel-ci-fallback-keystore-v1

      - name: Decode optional release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Package and verify APKs
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Kestrel-universal.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kestrel-debug.apk
          "${SDK_ROOT}/build-tools/35.0.0/apksigner" verify dist/Kestrel-universal.apk
          unzip -l dist/Kestrel-universal.apk | grep libproxy_core.so
          unzip -l dist/Kestrel-debug.apk | grep libproxy_core.so

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kestrel-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Kestrel-universal.apk
            dist/Kestrel-debug.apk
